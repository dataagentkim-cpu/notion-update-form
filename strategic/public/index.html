<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<title>전략과제 업데이트 입력</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:           #ffffff;
    --card-bg:      #ffffff;
    --card-border:  rgba(0, 0, 0, 0.08);
    --card-shadow:  0 1px 2px rgba(0,0,0,0.04), 0 6px 24px rgba(0,0,0,0.06);
    --input-bg:     #ffffff;
    --input-border: rgba(0, 0, 0, 0.14);
    --input-focus:  #4f46e5;
    --text-primary: rgba(0, 0, 0, 0.88);
    --text-secondary: rgba(0, 0, 0, 0.55);
    --text-tertiary: rgba(0, 0, 0, 0.40);
    --accent:       #4f46e5;
    --accent-2:     #7c3aed;
    --accent-bg:    #eef2ff;
    --success:      #059669;
    --success-bg:   #ecfdf5;
    --danger:       #dc2626;
    --danger-bg:    #fef2f2;
    --required:     #ef4444;
    --badge-bg:     #ede9fe;
    --badge-text:   #6d28d9;
    --primary-grad: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
    --primary-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:           #0e0e10;
      --card-bg:      #1c1c20;
      --card-border:  rgba(255, 255, 255, 0.08);
      --card-shadow:  0 1px 2px rgba(0,0,0,0.4), 0 6px 24px rgba(0,0,0,0.3);
      --input-bg:     #25252b;
      --input-border: rgba(255, 255, 255, 0.12);
      --text-primary: rgba(255, 255, 255, 0.94);
      --text-secondary: rgba(255, 255, 255, 0.58);
      --text-tertiary: rgba(255, 255, 255, 0.38);
      --accent-bg:    rgba(124, 58, 237, 0.18);
      --success-bg:   rgba(5, 150, 105, 0.18);
      --danger-bg:    rgba(220, 38, 38, 0.18);
      --badge-bg:     rgba(124, 58, 237, 0.28);
      --badge-text:   #c4b5fd;
      --primary-text: #ffffff;
    }
  }

  html, body {
    background: transparent;
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.011em;
  }
  body { padding: 12px 8px calc(20px + env(safe-area-inset-bottom)); }
  .container { max-width: 680px; margin: 0 auto; }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 20px 16px 22px;
    box-shadow: var(--card-shadow);
  }
  @media (max-width: 520px) {
    body { padding: 6px 0 calc(14px + env(safe-area-inset-bottom)); }
    .card { padding: 14px 10px 16px; border-radius: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
    .header { gap: 10px; margin-bottom: 14px; padding-bottom: 12px; }
    .header-icon { width: 34px; height: 34px; border-radius: 10px; }
    .header-icon svg { width: 18px; height: 18px; }
    .header-title { font-size: 17px; }
    .header-sub { font-size: 12px; }
    .field { margin-bottom: 11px; }
    .input, .textarea, .select { padding: 11px 12px; }
    .btn { padding: 0 14px; }
  }

  /* Header */
  .header {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 20px; padding-bottom: 18px;
    border-bottom: 1px solid var(--card-border);
  }
  .header-icon {
    flex-shrink: 0; width: 40px; height: 40px; border-radius: 12px;
    background: var(--primary-grad);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 12px rgba(79, 70, 229, 0.35);
  }
  .header-icon svg { width: 22px; height: 22px; color: #fff; }
  .header-text { flex: 1; min-width: 0; }
  .header-title {
    font-size: 20px; font-weight: 700; line-height: 1.25;
    letter-spacing: -0.022em; margin-bottom: 3px;
    background: var(--primary-grad);
    -webkit-background-clip: text; background-clip: text;
    color: transparent; display: inline-block;
  }
  .header-sub { font-size: 12.5px; color: var(--text-secondary); line-height: 1.5; }

  /* Tabs */
  .tabs {
    display: flex; gap: 4px; padding: 4px;
    background: var(--input-bg);
    border: 1px solid var(--card-border);
    border-radius: 11px; margin-bottom: 16px;
    overflow-x: auto;
  }
  .tab {
    flex: 1; min-width: max-content;
    padding: 9px 14px; background: transparent; border: none;
    border-radius: 8px; font-family: inherit;
    font-size: 13px; font-weight: 600;
    color: var(--text-secondary); cursor: pointer;
    transition: background 0.15s, color 0.15s; white-space: nowrap;
  }
  .tab:hover { color: var(--text-primary); }
  .tab.active {
    background: var(--card-bg); color: var(--accent);
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .mode-panel { display: none; }
  .mode-panel.active { display: block; }

  /* Fields */
  .field { margin-bottom: 14px; }
  .field-label {
    display: flex; align-items: center; flex-wrap: wrap; gap: 6px;
    font-size: 13px; font-weight: 600; color: var(--text-primary); margin-bottom: 6px;
  }
  .req { color: var(--required); font-weight: 700; }
  .field-row { display: grid; grid-template-columns: 1fr; gap: 14px; }
  @media (min-width: 520px) { .field-row { grid-template-columns: 1fr 1fr; } }

  .input, .textarea, .select {
    width: 100%; padding: 12px 14px;
    background: var(--input-bg);
    border: 1.5px solid var(--input-border); border-radius: 10px;
    font-family: inherit; font-size: 16px; line-height: 1.4;
    color: var(--text-primary);
    transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s;
    -webkit-appearance: none; appearance: none;
  }
  .input:hover, .textarea:hover, .select:hover:not(:disabled) {
    border-color: rgba(0,0,0,0.25);
  }
  @media (prefers-color-scheme: dark) {
    .input:hover, .textarea:hover, .select:hover:not(:disabled) {
      border-color: rgba(255,255,255,0.25);
    }
  }
  .select {
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path fill='none' stroke='%23888' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round' d='M1 1.5l5 5 5-5'/></svg>");
    background-repeat: no-repeat; background-position: right 13px center; padding-right: 36px;
  }
  .select:disabled { opacity: 0.55; cursor: not-allowed; }
  .input:focus, .textarea:focus, .select:focus {
    outline: none; border-color: var(--input-focus);
    box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.14);
  }
  .input::placeholder, .textarea::placeholder { color: var(--text-tertiary); }
  input[type="date"] { min-height: 46px; }
  .textarea { resize: vertical; min-height: 130px; line-height: 1.55; }

  /* Author chip */
  .author-chip {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 14px; background: var(--accent-bg); color: var(--accent);
    border-radius: 9px; font-size: 15px; font-weight: 600;
    border: 1.5px solid transparent;
  }
  .author-chip .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  /* Radio card list */
  .radio-list { display: grid; grid-template-columns: 1fr; gap: 8px; }
  .radio-card {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px; background: var(--input-bg);
    border: 1.5px solid var(--input-border); border-radius: 10px;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s, transform 0.08s, box-shadow 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .radio-card:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(79, 70, 229, 0.12); }
  .radio-card:active { transform: scale(0.99); }
  .radio-card input[type="radio"] {
    appearance: none; -webkit-appearance: none;
    width: 18px; height: 18px; border: 2px solid var(--input-border);
    border-radius: 50%; margin: 0; flex-shrink: 0;
    position: relative; cursor: pointer; transition: border-color 0.15s;
  }
  .radio-card input[type="radio"]:checked { border-color: var(--accent); }
  .radio-card input[type="radio"]:checked::after {
    content: ''; position: absolute; inset: 3px;
    border-radius: 50%; background: var(--accent);
  }
  .radio-card:has(input[type="radio"]:checked) {
    border-color: var(--accent); background: var(--accent-bg);
  }
  .radio-card-text { flex: 1; min-width: 0; font-size: 15px; font-weight: 500; color: var(--text-primary); }
  .radio-empty {
    padding: 14px; border: 1.5px dashed var(--input-border); border-radius: 9px;
    text-align: center; color: var(--text-secondary); font-size: 14px;
  }

  /* Checkbox card list */
  .check-list { display: grid; grid-template-columns: 1fr; gap: 6px; }
  @media (min-width: 420px) { .check-list { grid-template-columns: 1fr 1fr; } }
  .check-card {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; background: var(--input-bg);
    border: 1.5px solid var(--input-border); border-radius: 10px;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s, transform 0.08s;
    -webkit-tap-highlight-color: transparent;
  }
  .check-card:hover { border-color: var(--accent); }
  .check-card:active { transform: scale(0.99); }
  .check-card input[type="checkbox"] {
    appearance: none; -webkit-appearance: none;
    width: 17px; height: 17px; border: 2px solid var(--input-border);
    border-radius: 4px; margin: 0; flex-shrink: 0;
    position: relative; cursor: pointer; transition: border-color 0.15s, background 0.15s;
  }
  .check-card input[type="checkbox"]:checked {
    border-color: var(--accent); background: var(--accent);
  }
  .check-card input[type="checkbox"]:checked::after {
    content: ''; position: absolute;
    left: 3px; top: 0px; width: 5px; height: 9px;
    border: 2px solid #fff; border-top: none; border-left: none;
    transform: rotate(45deg);
  }
  .check-card:has(input[type="checkbox"]:checked) {
    border-color: var(--accent); background: var(--accent-bg);
  }
  .check-card-text { flex: 1; min-width: 0; font-size: 14px; font-weight: 500; color: var(--text-primary); }

  /* Buttons */
  .actions { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 18px; }
  @media (min-width: 520px) { .actions { grid-template-columns: auto 1fr auto; } }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 46px; padding: 0 18px;
    background: var(--card-bg); border: 1.5px solid var(--input-border); border-radius: 11px;
    font-family: inherit; font-size: 15px; font-weight: 600; color: var(--text-primary);
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s, transform 0.08s, box-shadow 0.2s;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  .btn:hover { border-color: var(--text-secondary); }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { cursor: not-allowed; opacity: 0.5; }
  .btn-primary {
    background: var(--primary-grad); color: var(--primary-text); border: none;
    box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);
  }
  .btn-primary:hover {
    filter: brightness(1.08); box-shadow: 0 6px 20px rgba(79, 70, 229, 0.45);
    transform: translateY(-1px);
  }
  .btn-primary:active { transform: translateY(0) scale(0.98); }
  .btn-danger {
    background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
    color: #fff; border: none;
    box-shadow: 0 4px 14px rgba(220, 38, 38, 0.35);
  }

  /* Status */
  .status {
    margin-bottom: 14px; padding: 12px 14px; border-radius: 9px;
    font-size: 14px; line-height: 1.5; display: none;
  }
  .status.show { display: block; }
  .status-success { background: var(--success-bg); color: var(--success); }
  .status-error   { background: var(--danger-bg);  color: var(--danger); }
  .status-info    { background: var(--accent-bg);  color: var(--accent); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="card">
  <header class="header">
    <div class="header-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <path d="M14 2v6h6"/><path d="M9 14l2 2 4-4"/>
      </svg>
    </div>
    <div class="header-text">
      <h1 class="header-title">전략과제 관리</h1>
      <p class="header-sub">진척사항 입력 · 과제 추가/수정/삭제</p>
    </div>
  </header>

  <!-- 모드 탭 (?mode=full 일 때만 표시) -->
  <div class="tabs" id="modeTabs" style="display:none">
    <button type="button" class="tab active" data-mode="progress">진척사항 입력</button>
    <button type="button" class="tab" data-mode="create">+ 신규 과제</button>
    <button type="button" class="tab" data-mode="edit">과제 수정</button>
    <button type="button" class="tab" data-mode="delete">과제 삭제</button>
  </div>

  <!-- 상태 알림 -->
  <div id="status" class="status" role="status" aria-live="polite"></div>

  <!-- 공통: 작성자/날짜 -->
  <div class="field-row">
    <div class="field" id="authorField">
      <label class="field-label" for="author">작성자(임원) <span class="req">*</span></label>
      <select id="author" class="select" required disabled>
        <option value="">불러오는 중...</option>
      </select>
      <div id="authorLocked" class="author-chip" style="display:none">
        <span class="dot"></span><span id="authorLockedName">—</span>
      </div>
    </div>
    <div class="field" id="dateField">
      <label class="field-label" for="date">작성일자</label>
      <input id="date" class="input" type="date"/>
    </div>
  </div>

  <!-- ── 진척사항 입력 모드 ── -->
  <form id="updateForm" class="mode-panel active" data-panel="progress">
    <div class="field">
      <label class="field-label">전략과제명 <span class="req">*</span></label>
      <div id="initiativeList" class="radio-list">
        <div class="radio-empty">먼저 작성자를 선택하세요</div>
      </div>
    </div>
    <div class="field">
      <label class="field-label" for="summary">요약 제목 <span class="req">*</span></label>
      <input id="summary" class="input" type="text" required
             placeholder="예) 인도네시아 금융지주사 본인가 협의 진행 경과" autocomplete="off"/>
    </div>
    <div class="field">
      <label class="field-label" for="content">업데이트 내용</label>
      <textarea id="content" class="textarea"
                placeholder="예) 금감원 협의 일정 1차 완료. 현지 파트너 후보 3개사 실사 진행 중이며, 5월 말 우선협상 대상자 선정 예정."></textarea>
    </div>
    <div class="field-row">
      <div class="field">
        <label class="field-label" for="priority">중요도</label>
        <select id="priority" class="select">
          <option value="대시보드 게시">대시보드 게시</option>
          <option value="과제이력 관리" selected>과제이력 관리</option>
        </select>
      </div>
      <div class="field">
        <label class="field-label" for="files">파일과 미디어</label>
        <input id="files" type="file" class="input" multiple style="padding:9px 12px"/>
        <div id="filesStatus" style="font-size:12px;color:var(--text-secondary);margin-top:6px"></div>
      </div>
    </div>
    <div class="actions">
      <button type="button" id="btnAI" class="btn">✨ AI로 다듬기</button>
      <button type="submit" id="btnSave" class="btn btn-primary">📤 업데이트 제출</button>
      <button type="button" id="btnReset" class="btn">초기화</button>
    </div>
  </form>

  <!-- ── 신규 과제 모드 ── -->
  <form id="createForm" class="mode-panel" data-panel="create">
    <div class="field">
      <label class="field-label" for="newTaskName">전략과제 명 <span class="req">*</span></label>
      <input id="newTaskName" class="input" type="text"
             placeholder="예) 무바달라 파트너십 확대" autocomplete="off"/>
    </div>
    <div class="field">
      <label class="field-label">담당임원 <span class="req">*</span> <span style="font-size:12px;font-weight:400;color:var(--text-secondary)">(1명 이상 선택)</span></label>
      <div id="createOwnerList" class="check-list">
        <div class="radio-empty">임원 목록 로딩 중...</div>
      </div>
    </div>
    <div class="field">
      <label class="field-label">참여인원 <span style="font-size:12px;font-weight:400;color:var(--text-secondary)">(선택사항)</span></label>
      <div id="createParticipantList" class="check-list">
        <div class="radio-empty">임원 목록 로딩 중...</div>
      </div>
    </div>
    <div class="actions">
      <button type="submit" id="btnCreate" class="btn btn-primary">➕ 신규 과제 생성</button>
      <button type="button" id="btnCreateReset" class="btn">초기화</button>
    </div>
  </form>

  <!-- ── 과제 수정 모드 ── -->
  <form id="editForm" class="mode-panel" data-panel="edit">
    <div class="field">
      <label class="field-label">수정할 전략과제 선택 <span class="req">*</span></label>
      <div id="editTaskList" class="radio-list">
        <div class="radio-empty">로딩 중...</div>
      </div>
    </div>
    <div class="field">
      <label class="field-label" for="editTaskName">전략과제 명 <span class="req">*</span></label>
      <input id="editTaskName" class="input" type="text" disabled placeholder="과제를 먼저 선택하세요"/>
    </div>
    <div class="field">
      <label class="field-label">담당임원 <span class="req">*</span></label>
      <div id="editOwnerList" class="check-list">
        <div class="radio-empty">과제를 선택하면 기존 담당임원이 표시됩니다</div>
      </div>
    </div>
    <div class="field">
      <label class="field-label">참여인원</label>
      <div id="editParticipantList" class="check-list">
        <div class="radio-empty">과제를 선택하면 기존 참여인원이 표시됩니다</div>
      </div>
    </div>
    <div class="actions">
      <button type="submit" id="btnEdit" class="btn btn-primary" disabled>✏️ 수정 완료</button>
      <button type="button" id="btnEditCancel" class="btn">취소</button>
    </div>
  </form>

  <!-- ── 과제 삭제 모드 ── -->
  <form id="deleteForm" class="mode-panel" data-panel="delete">
    <div class="field">
      <label class="field-label">삭제할 전략과제 선택 <span class="req">*</span></label>
      <div id="deleteTaskList" class="radio-list">
        <div class="radio-empty">로딩 중...</div>
      </div>
    </div>
    <div class="field">
      <div style="padding:12px 14px;background:var(--danger-bg);color:var(--danger);border-radius:9px;font-size:13px">
        ⚠ 삭제된 과제는 노션에서 보관처리(Archive)됩니다. 신중히 진행하세요.
      </div>
    </div>
    <div class="actions">
      <button type="submit" id="btnDelete" class="btn btn-danger" disabled>🗑 과제 삭제</button>
    </div>
  </form>

  </div><!-- .card -->
</div><!-- .container -->

<script>
  const WORKER_URL = 'https://notion-update-form-strategic.dataagentkim.workers.dev';
  const LS_AUTHOR_KEY = 'notion-update-form/last-author-id';

  // ─── Gemini polish ────────────────────────────────────────────────
  let _llmKeyCache = null;
  async function getLlmKey() {
    if (_llmKeyCache) return _llmKeyCache;
    const r = await fetch(WORKER_URL + '/api/llm-key');
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'AI 키 발급 실패');
    _llmKeyCache = d;
    return d;
  }
  const POLISH_SYSTEM_PROMPT = `당신은 한화금융그룹 임원이 사장에게 올리는 전략과제 진행 보고를 다듬는 비서입니다.
임원이 작성한 거친 메모(요약 제목 + 상세 내용)를 받아 사장 보고용 격식체로 정제하여 JSON으로만 응답합니다.

원칙:
- 사실 보존 최우선: 입력에 없는 수치·일정·조직명·금액·고유명사를 새로 만들거나 추정하지 말 것.
- 보고체 사용: 명사형 종결(~함, ~예정, ~검토, ~추진, ~조치 등) 중심의 간결하고 객관적인 어조.
- 구어체·축약어·이모지·감탄사 금지.
- 모호·중복 표현은 명확하고 간결하게 재작성.

출력 형식:
- summary: 핵심 보고 요지 30자 이내 한 줄 (명사구 위주, 동사 종결 가능).
- content: 임원 보고용 단락 3~5줄. 가능하면 진행 경과 → 향후 계획 → 이슈/요청 순으로 구성.`;
  async function polishViaGemini(summary, content) {
    const { key, model } = await getLlmKey();
    const userMsg = `[요약 제목 초안]\n${summary || '(없음)'}\n\n[상세 내용 초안]\n${content || '(없음)'}`;
    const res = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(key)}`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          systemInstruction: { parts: [{ text: POLISH_SYSTEM_PROMPT }] },
          contents: [{ role: 'user', parts: [{ text: userMsg }] }],
          generationConfig: {
            responseMimeType: 'application/json',
            responseSchema: {
              type: 'object',
              properties: { summary: { type: 'string' }, content: { type: 'string' } },
              required: ['summary', 'content'],
            },
            maxOutputTokens: 1024, temperature: 0.3,
            thinkingConfig: { thinkingBudget: 0 },
          },
        }),
      }
    );
    const data = await res.json();
    if (!res.ok) throw new Error(data.error?.message || ('Gemini 오류 ' + res.status));
    const text = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
    try { return JSON.parse(text); }
    catch { return { summary, content }; }
  }
  // ──────────────────────────────────────────────────────────────────

  const $ = (id) => document.getElementById(id);

  const urlParams = new URLSearchParams(location.search);
  const urlAuthorId = (urlParams.get('author_id') || '').trim();
  const urlAuthorName = (urlParams.get('author') || '').trim();
  const urlMode = (urlParams.get('mode') || '').trim();

  if (urlMode === 'full') {
    $('modeTabs').style.display = '';
  }

  // 모드 탭 동작
  function setMode(mode) {
    document.querySelectorAll('.tab').forEach((t) => {
      t.classList.toggle('active', t.dataset.mode === mode);
    });
    document.querySelectorAll('.mode-panel').forEach((p) => {
      p.classList.toggle('active', p.dataset.panel === mode);
    });
    $('dateField').style.display = (mode === 'progress') ? '' : 'none';
    hideStatus();
  }
  document.querySelectorAll('.tab').forEach((t) => {
    t.addEventListener('click', () => {
      setMode(t.dataset.mode);
      const m = t.dataset.mode;
      if (m === 'edit') renderTaskRadioList('editTaskList', 'edit-task', onEditSelect);
      else if (m === 'delete') renderTaskRadioList('deleteTaskList', 'delete-task', onDeleteSelect);
      else if (m === 'create') renderExecCheckboxes();
    });
  });

  // 작성일자
  const offsetMs = new Date().getTimezoneOffset() * 60000;
  const todayStr = () => new Date(Date.now() - offsetMs).toISOString().slice(0, 10);
  $('date').value = todayStr();

  let executiveList = [];       // [{id, name}]
  let executiveMap = new Map(); // id → name
  let initiativeMap = new Map(); // id → name
  let currentAuthorId = '';

  function showStatus(msg, type) {
    const s = $('status');
    s.textContent = msg;
    s.className = 'status show status-' + type;
    try { s.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch {}
  }
  function hideStatus() {
    const s = $('status');
    s.className = 'status';
    s.textContent = '';
  }

  function lockAuthor(id, name) {
    currentAuthorId = id;
    $('author').style.display = 'none';
    $('author').required = false;
    $('authorLocked').style.display = 'inline-flex';
    $('authorLockedName').textContent = name;
  }

  function setSelectOptions(sel, items, placeholder) {
    const frag = document.createDocumentFragment();
    const ph = document.createElement('option');
    ph.value = ''; ph.textContent = placeholder;
    frag.appendChild(ph);
    for (const it of items) {
      const opt = document.createElement('option');
      opt.value = it.id; opt.textContent = it.name;
      frag.appendChild(opt);
    }
    sel.innerHTML = '';
    sel.appendChild(frag);
  }

  // 진척사항: 과제 라디오 렌더
  function renderInitiatives(list, placeholder) {
    const el = $('initiativeList');
    el.innerHTML = '';
    if (!list || list.length === 0) {
      const d = document.createElement('div');
      d.className = 'radio-empty'; d.textContent = placeholder || '과제가 없습니다';
      el.appendChild(d); return;
    }
    for (const it of list) {
      const label = document.createElement('label');
      label.className = 'radio-card';
      const inp = document.createElement('input');
      inp.type = 'radio'; inp.name = 'initiative'; inp.value = it.id; inp.required = true;
      const span = document.createElement('span');
      span.className = 'radio-card-text'; span.textContent = it.name;
      label.appendChild(inp); label.appendChild(span);
      el.appendChild(label);
    }
    if (list.length === 1) {
      const only = el.querySelector('input[name="initiative"]');
      if (only) only.checked = true;
    }
  }

  function selectedInitiativeId() {
    const c = $('initiativeList').querySelector('input[name="initiative"]:checked');
    return c ? c.value : '';
  }

  // 임원 체크박스 렌더 (신규/수정 모드)
  function renderCheckboxList(containerId, checkboxName, selectedIds = []) {
    const el = $(containerId);
    el.innerHTML = '';
    if (executiveList.length === 0) {
      const d = document.createElement('div');
      d.className = 'radio-empty'; d.textContent = '임원 목록이 없습니다';
      el.appendChild(d); return;
    }
    for (const exec of executiveList) {
      const label = document.createElement('label');
      label.className = 'check-card';
      const inp = document.createElement('input');
      inp.type = 'checkbox'; inp.name = checkboxName; inp.value = exec.id;
      if (selectedIds.includes(exec.id)) inp.checked = true;
      const span = document.createElement('span');
      span.className = 'check-card-text'; span.textContent = exec.name;
      label.appendChild(inp); label.appendChild(span);
      el.appendChild(label);
    }
  }

  function getCheckedIds(checkboxName) {
    return [...document.querySelectorAll(`input[name="${checkboxName}"]:checked`)].map(i => i.value);
  }

  function renderExecCheckboxes() {
    renderCheckboxList('createOwnerList', 'create-owner', []);
    renderCheckboxList('createParticipantList', 'create-participant', []);
  }

  async function loadExecutives() {
    try {
      const res = await fetch(WORKER_URL + '/api/bootstrap');
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || ('서버 오류 ' + res.status));
      executiveList = data.executives || [];
      executiveMap = new Map(executiveList.map((e) => [e.id, e.name]));

      if (urlAuthorId && executiveMap.has(urlAuthorId)) {
        lockAuthor(urlAuthorId, executiveMap.get(urlAuthorId));
        await loadInitiatives(urlAuthorId);
        return;
      }
      if (urlAuthorName) {
        const match = executiveList.find((e) => e.name === urlAuthorName);
        if (match) {
          lockAuthor(match.id, match.name);
          await loadInitiatives(match.id);
          return;
        }
      }

      setSelectOptions($('author'), executiveList, '임원을 선택하세요');
      $('author').disabled = false;
      const last = localStorage.getItem(LS_AUTHOR_KEY);
      if (last && executiveMap.has(last)) {
        $('author').value = last;
        currentAuthorId = last;
        await loadInitiatives(last);
      }
    } catch (err) {
      setSelectOptions($('author'), [], '임원 로드 실패');
      showStatus('❌ 임원 목록 로드 실패: ' + err.message, 'error');
    }
  }

  async function loadInitiatives(executiveId) {
    if (!executiveId) {
      initiativeMap = new Map();
      renderInitiatives([], '먼저 작성자를 선택하세요');
      return;
    }
    renderInitiatives([], '불러오는 중...');
    try {
      const res = await fetch(WORKER_URL + '/api/initiatives?executive_id=' + encodeURIComponent(executiveId));
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || ('서버 오류 ' + res.status));
      const list = data.initiatives || [];
      initiativeMap = new Map(list.map((i) => [i.id, i.name]));
      renderInitiatives(list, '본인 과제가 없습니다');
    } catch (err) {
      renderInitiatives([], '과제 로드 실패');
      showStatus('❌ 전략과제 목록 로드 실패: ' + err.message, 'error');
    }
  }

  $('author').addEventListener('change', () => {
    const id = $('author').value;
    currentAuthorId = id;
    if (id) localStorage.setItem(LS_AUTHOR_KEY, id);
    loadInitiatives(id);
  });

  // ─── 진척사항 입력 ────────────────────────────────────────────────
  let originalDraft = null;
  const btnAI = $('btnAI');
  function resetAIButton() {
    originalDraft = null;
    btnAI.dataset.mode = '';
    btnAI.innerHTML = '✨ AI로 다듬기';
  }

  $('btnReset').addEventListener('click', () => {
    $('summary').value = '';
    $('content').value = '';
    $('date').value = todayStr();
    $('priority').value = '과제이력 관리';
    $('files').value = '';
    $('filesStatus').textContent = '';
    const checked = $('initiativeList').querySelector('input[name="initiative"]:checked');
    if (checked) checked.checked = false;
    resetAIButton(); hideStatus();
  });

  $('files').addEventListener('change', () => {
    const fs = $('files').files;
    $('filesStatus').textContent = fs && fs.length ? `${fs.length}개 선택됨` : '';
  });

  btnAI.addEventListener('click', async () => {
    if (btnAI.dataset.mode === 'undo' && originalDraft) {
      $('summary').value = originalDraft.summary;
      $('content').value = originalDraft.content;
      originalDraft = null;
      btnAI.dataset.mode = '';
      btnAI.innerHTML = '✨ AI로 다듬기';
      hideStatus(); return;
    }
    const summary = $('summary').value.trim();
    const content = $('content').value.trim();
    if (!summary && !content) { showStatus('다듬을 내용을 먼저 입력하세요.', 'error'); return; }
    hideStatus();
    btnAI.disabled = true; btnAI.innerHTML = '⏳ 다듬는 중...';
    try {
      const data = await polishViaGemini(summary, content);
      originalDraft = { summary, content };
      $('summary').value = data.summary || summary;
      $('content').value = data.content || content;
      showStatus('✨ AI가 다듬었습니다. 검토 후 저장하거나, "↩ 원문 복원"으로 되돌리세요.', 'success');
      btnAI.dataset.mode = 'undo'; btnAI.innerHTML = '↩ 원문 복원';
    } catch (err) {
      showStatus('❌ 다듬기 실패: ' + err.message, 'error');
      btnAI.innerHTML = '✨ AI로 다듬기';
    } finally { btnAI.disabled = false; }
  });

  $('updateForm').addEventListener('submit', async (e) => {
    e.preventDefault(); hideStatus();
    const initiativeId = selectedInitiativeId();
    if (!currentAuthorId) { showStatus('❌ 작성자를 선택하세요.', 'error'); return; }
    if (!initiativeId) { showStatus('❌ 전략과제를 선택하세요.', 'error'); return; }

    const btnSave = $('btnSave');
    btnSave.disabled = true;
    const origText = btnSave.innerHTML;
    btnSave.innerHTML = '⏳ 제출 중...';
    const filesStatus = $('filesStatus');

    const fileEls = $('files').files;
    const fileUploads = [];
    if (fileEls && fileEls.length > 0) {
      for (let i = 0; i < fileEls.length; i++) {
        const f = fileEls[i];
        filesStatus.textContent = `⏳ 업로드 중 ${i+1}/${fileEls.length}: ${f.name}`;
        const fd = new FormData(); fd.append('file', f, f.name);
        try {
          const r = await fetch(WORKER_URL + '/api/upload', { method: 'POST', body: fd });
          const d = await r.json();
          if (!r.ok) throw new Error(d.error || ('업로드 오류 ' + r.status));
          fileUploads.push({ id: d.id, name: d.name });
        } catch (err) {
          showStatus('❌ 파일 업로드 실패 (' + f.name + '): ' + err.message, 'error');
          btnSave.disabled = false; btnSave.innerHTML = origText;
          filesStatus.textContent = ''; return;
        }
      }
      filesStatus.textContent = `✅ ${fileEls.length}개 업로드 완료`;
    }

    const payload = {
      initiative_id: initiativeId,
      initiative_name: initiativeMap.get(initiativeId) || '',
      author_id: currentAuthorId,
      author_name: executiveMap.get(currentAuthorId) || '',
      summary: $('summary').value.trim(),
      content: $('content').value.trim(),
      date: $('date').value,
      priority: $('priority').value || '과제이력 관리',
      file_uploads: fileUploads,
    };
    try {
      const res = await fetch(WORKER_URL + '/api/save', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || ('서버 오류 ' + res.status));
      const warnings = (data.warnings || []).join(' / ');
      showStatus('✅ 업데이트가 제출되었습니다.' + (warnings ? ' (' + warnings + ')' : ''), 'success');
      $('summary').value = ''; $('content').value = '';
      $('priority').value = '과제이력 관리';
      $('files').value = ''; filesStatus.textContent = '';
      resetAIButton();
    } catch (err) {
      showStatus('❌ 제출 실패: ' + err.message, 'error');
    } finally {
      btnSave.disabled = false; btnSave.innerHTML = origText;
    }
  });

  // ─── 수정/삭제 모드 공통: 과제 라디오 리스트 ─────────────────────
  function renderTaskRadioList(containerId, radioName, onSelect) {
    const el = $(containerId);
    el.innerHTML = '';
    const items = [...initiativeMap.entries()];
    if (items.length === 0) {
      const d = document.createElement('div');
      d.className = 'radio-empty'; d.textContent = '본인 담당 과제가 없습니다';
      el.appendChild(d); return;
    }
    for (const [id, name] of items) {
      const label = document.createElement('label');
      label.className = 'radio-card';
      const inp = document.createElement('input');
      inp.type = 'radio'; inp.name = radioName; inp.value = id;
      inp.addEventListener('change', () => onSelect && onSelect(id, name));
      const span = document.createElement('span');
      span.className = 'radio-card-text'; span.textContent = name;
      label.appendChild(inp); label.appendChild(span);
      el.appendChild(label);
    }
  }

  // ─── 신규 과제 ────────────────────────────────────────────────────
  $('createForm').addEventListener('submit', async (e) => {
    e.preventDefault(); hideStatus();
    const name = $('newTaskName').value.trim();
    const ownerIds = getCheckedIds('create-owner');
    const participantIds = getCheckedIds('create-participant');
    if (!name) { showStatus('❌ 과제명을 입력하세요.', 'error'); return; }
    if (ownerIds.length === 0) { showStatus('❌ 담당임원을 1명 이상 선택하세요.', 'error'); return; }

    const btn = $('btnCreate');
    btn.disabled = true; const orig = btn.innerHTML; btn.innerHTML = '⏳ 생성 중...';
    try {
      const res = await fetch(WORKER_URL + '/api/initiative', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, owner_ids: ownerIds, participant_ids: participantIds }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || ('서버 오류 ' + res.status));
      showStatus('✅ 신규 전략과제가 생성되었습니다: ' + name, 'success');
      $('newTaskName').value = '';
      document.querySelectorAll('input[name="create-owner"], input[name="create-participant"]').forEach(i => i.checked = false);
      // 목록 갱신
      if (data.page_id) initiativeMap.set(data.page_id, name);
      renderInitiatives([...initiativeMap.entries()].map(([id, nm]) => ({ id, name: nm })), '과제가 없습니다');
      setTimeout(() => loadInitiatives(currentAuthorId), 1500);
    } catch (err) {
      showStatus('❌ 생성 실패: ' + err.message, 'error');
    } finally { btn.disabled = false; btn.innerHTML = orig; }
  });

  $('btnCreateReset').addEventListener('click', () => {
    $('newTaskName').value = '';
    document.querySelectorAll('input[name="create-owner"], input[name="create-participant"]').forEach(i => i.checked = false);
    hideStatus();
  });

  // ─── 과제 수정 ────────────────────────────────────────────────────
  let editingInitiativeId = null;

  async function onEditSelect(id, name) {
    editingInitiativeId = id;
    const nameInput = $('editTaskName');
    const btn = $('btnEdit');
    nameInput.disabled = true; btn.disabled = true;
    nameInput.value = '불러오는 중...';
    $('editOwnerList').innerHTML = '<div class="radio-empty">불러오는 중...</div>';
    $('editParticipantList').innerHTML = '<div class="radio-empty">불러오는 중...</div>';
    try {
      const r = await fetch(WORKER_URL + '/api/initiative?initiative_id=' + encodeURIComponent(id));
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || '조회 실패');
      nameInput.value = d.name || name;
      nameInput.disabled = false;
      renderCheckboxList('editOwnerList', 'edit-owner', d.owner_ids || []);
      renderCheckboxList('editParticipantList', 'edit-participant', d.participant_ids || []);
      btn.disabled = false;
    } catch (err) {
      showStatus('❌ 과제 정보 로드 실패: ' + err.message, 'error');
      nameInput.value = ''; nameInput.disabled = false;
      renderCheckboxList('editOwnerList', 'edit-owner', []);
      renderCheckboxList('editParticipantList', 'edit-participant', []);
    }
  }

  $('editForm').addEventListener('submit', async (e) => {
    e.preventDefault(); hideStatus();
    if (!editingInitiativeId) { showStatus('❌ 과제를 선택하세요.', 'error'); return; }
    const name = $('editTaskName').value.trim();
    const ownerIds = getCheckedIds('edit-owner');
    const participantIds = getCheckedIds('edit-participant');
    if (!name) { showStatus('❌ 과제명을 입력하세요.', 'error'); return; }
    if (ownerIds.length === 0) { showStatus('❌ 담당임원을 1명 이상 선택하세요.', 'error'); return; }

    const btn = $('btnEdit');
    btn.disabled = true; const orig = btn.innerHTML; btn.innerHTML = '⏳ 수정 중...';
    try {
      const res = await fetch(WORKER_URL + '/api/initiative', {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          initiative_id: editingInitiativeId,
          name, owner_ids: ownerIds, participant_ids: participantIds,
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || ('서버 오류 ' + res.status));
      showStatus('✅ 과제가 수정되었습니다: ' + name, 'success');
      initiativeMap.set(editingInitiativeId, name);
      renderInitiatives([...initiativeMap.entries()].map(([id, nm]) => ({ id, name: nm })), '과제가 없습니다');
      renderTaskRadioList('editTaskList', 'edit-task', onEditSelect);
      renderTaskRadioList('deleteTaskList', 'delete-task', onDeleteSelect);
      setTimeout(() => loadInitiatives(currentAuthorId), 1500);
    } catch (err) {
      showStatus('❌ 수정 실패: ' + err.message, 'error');
    } finally { btn.disabled = false; btn.innerHTML = orig; }
  });

  $('btnEditCancel').addEventListener('click', () => {
    editingInitiativeId = null;
    $('editTaskName').value = ''; $('editTaskName').disabled = true;
    $('btnEdit').disabled = true;
    $('editOwnerList').innerHTML = '<div class="radio-empty">과제를 선택하면 기존 담당임원이 표시됩니다</div>';
    $('editParticipantList').innerHTML = '<div class="radio-empty">과제를 선택하면 기존 참여인원이 표시됩니다</div>';
    const checked = document.querySelector('input[name="edit-task"]:checked');
    if (checked) checked.checked = false;
    hideStatus();
  });

  // ─── 과제 삭제 ────────────────────────────────────────────────────
  let deletingInitiativeId = null;

  function onDeleteSelect(id) {
    deletingInitiativeId = id;
    $('btnDelete').disabled = false;
  }

  $('deleteForm').addEventListener('submit', async (e) => {
    e.preventDefault(); hideStatus();
    if (!deletingInitiativeId) return;
    const taskName = initiativeMap.get(deletingInitiativeId) || '(과제)';
    if (!confirm(`정말 삭제(보관처리)할까요?\n\n- ${taskName}\n\n삭제 후에는 되돌리기 어렵습니다.`)) return;

    const btn = $('btnDelete');
    btn.disabled = true; const orig = btn.innerHTML; btn.innerHTML = '⏳ 삭제 중...';
    try {
      const res = await fetch(WORKER_URL + '/api/initiative', {
        method: 'DELETE', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ initiative_id: deletingInitiativeId }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || ('서버 오류 ' + res.status));
      showStatus('✅ 삭제되었습니다: ' + taskName, 'success');
      initiativeMap.delete(deletingInitiativeId);
      const remaining = [...initiativeMap.entries()].map(([id, name]) => ({ id, name }));
      renderInitiatives(remaining, '과제가 없습니다');
      renderTaskRadioList('deleteTaskList', 'delete-task', onDeleteSelect);
      renderTaskRadioList('editTaskList', 'edit-task', onEditSelect);
      deletingInitiativeId = null;
      $('btnDelete').disabled = true;
      setTimeout(() => loadInitiatives(currentAuthorId), 1500);
    } catch (err) {
      showStatus('❌ 삭제 실패: ' + err.message, 'error');
    } finally { btn.disabled = false; btn.innerHTML = orig; }
  });

  loadExecutives();
</script>
</body>
</html>
